appId: com.ajatt.app
productName: 일용직 근태관리
copyright: Copyright © 2026

directories:
  output: dist-electron

asar: true

files:
  - electron/**/*
  - package.json

extraResources:
  - from: out
    to: app-out
    filter:
      - "**/*"

mac:
  category: public.app-category.utilities
  target:
    - target: dmg
      arch:
        - arm64
        - x64

win:
  target:
    - target: nsis
      arch:
        - x64
  compression: maximum

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: 일용직 근태관리
  uninstallDisplayName: 일용직 근태관리
  installerLanguages:
    - ko_KR
    - en_US
  language: 1042
